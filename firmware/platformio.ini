[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

monitor_speed = 460800
upload_speed = 460800
upload_port = COM8
monitor_port = COM8

board_build.partitions = huge_app.csv
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -Iinclude
    "-IC:/Users/buddh/.platformio/packages/framework-arduinoespressif32-esp32-libs/include/espressif__esp-tflite-micro"
    "-IC:/Users/buddh/.platformio/packages/framework-arduinoespressif32-esp32-libs/include/espressif__esp-tflite-micro/third_party/flatbuffers/include"
    "-IC:/Users/buddh/.platformio/packages/framework-arduinoespressif32-esp32-libs/include/espressif__esp-tflite-micro/third_party/gemmlowp"
    "-IC:/Users/buddh/.platformio/packages/framework-arduinoespressif32-esp32-libs/include/espressif__esp-tflite-micro/third_party/ruy"
    "-IC:/Users/buddh/.platformio/packages/framework-arduinoespressif32-esp32-libs/include/espressif__esp-nn/include"
    "-LC:/Users/buddh/.platformio/packages/framework-arduinoespressif32-esp32-libs/lib"
    -lespressif__esp-tflite-micro
    -lespressif__esp-nn
